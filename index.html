<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Daily Space Explorer</title>
        <link rel="stylesheet" href="style.css">
        </head>
        <body>
          <div class="container">
              <header>
                    <h1>🌌 Daily Space Explorer</h1>
                          <p>Discover the cosmos, one day at a time with NASA APOD</p>
                                <div class="controls">
                                        <label for="date-picker">Select Date:</label>
                                                <input type="date" id="date-picker">
                                                        <button id="fetch-btn">Explore</button>
                                                              </div>
                                                                  </header>

                                                                      <main id="content">
                                                                            <div id="loader" class="hidden">Scanning the cosmos...</div>
                                                                                  <div id="media-container"></div>
                                                                                        <h2 id="media-title"></h2>
                                                                                              <p id="media-date" class="date-tag"></p>
                                                                                                    <p id="media-explanation"></p>
                                                                                                        </main>
                                                                                                          </div>

                                                                                                            <script src="app.js"></script>
                                                                                                            </body>
                                                                                                            </html>
